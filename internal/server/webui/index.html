<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>share-clip · 局域网剪贴板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='4' width='16' height='17' rx='3' fill='%233370ff'/%3E%3Crect x='8' y='2' width='8' height='5' rx='2' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root {
  --fg: #1d2129;
  --muted: #86909c;
  --faint: #a9b0bb;
  --line: #e5e6eb;
  --line-strong: #d5d8de;
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --accent: #3370ff;
  --accent-hover: #245bdb;
  --accent-soft: #eaf0ff;
  --ok: #00a870;
  --warn: #d97706;
  --danger: #d93a3a;
  --chip: #f2f3f5;
  --radius: 8px;
  --radius-sm: 6px;
  --shadow-pop: 0 4px 16px rgba(29, 33, 41, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #e7e9ec;
    --muted: #8b929c;
    --faint: #6b7280;
    --line: #2f3339;
    --line-strong: #41464d;
    --bg: #17181a;
    --surface: #202124;
    --surface-2: #26282c;
    --accent: #5b8cff;
    --accent-hover: #7ba3ff;
    --accent-soft: #1e2a44;
    --ok: #23c07f;
    --warn: #e0952a;
    --danger: #ef6060;
    --chip: #2a2d31;
    --shadow-pop: 0 4px 16px rgba(0, 0, 0, .40);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* .btn 的 display 会覆盖 hidden 属性 */
html { scroll-behavior: smooth; }
body {
  font-family: "Inter", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  margin: 0; color: var(--fg); font-size: 14px;
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
svg { flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 820px; margin: 0 auto; padding: 11px 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.logo {
  width: 30px; height: 30px; border-radius: 7px; background: var(--accent);
  display: grid; place-items: center; color: #fff;
}
.brand h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .1px; }
.brand small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 1px; }
.bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }

/* live node count */
.nodewrap { position: relative; }
.nodepill {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--radius-sm); padding: 6px 11px; cursor: pointer;
  color: var(--fg); font-size: 13px; font-family: inherit;
  transition: border-color .15s, background .15s;
}
.nodepill:hover { border-color: var(--line-strong); background: var(--surface-2); }
.nodepill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.nodepill.online .dot { background: var(--ok); }
.nodepill b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.roster {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-pop); padding: 6px; display: none; z-index: 60;
}
.roster.open { display: block; }
.roster h3 {
  font-size: 12px; color: var(--muted); margin: 6px 10px; font-weight: 500;
}
.roster .row {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: var(--radius-sm); font-size: 13px;
}
.roster .row:hover { background: var(--surface-2); }
.roster .row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.roster .row .id { color: var(--faint); font-size: 11.5px; margin-left: auto; max-width: 96px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster .none { color: var(--muted); padding: 8px 10px; font-size: 13px; }

/* connection chip */
.conn {
  display: flex; align-items: center; gap: 6px; font-size: 12.5px;
  color: var(--muted); background: var(--chip); border-radius: var(--radius-sm);
  padding: 6px 10px;
}
.conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.conn.retry .dot { background: var(--warn); animation: blink 1.2s infinite; }
.conn.down .dot { background: var(--danger); }
@keyframes blink { 50% { opacity: .3; } }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; font-size: 13px;
  font-family: inherit; transition: border-color .15s, color .15s, background .15s;
}
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn:active { background: var(--chip); }
.btn:disabled { opacity: .5; cursor: default; }
/* 主操作在卡片里重复出现，用安静的描边样式而非实心色块 */
.btn.accent { border-color: var(--line); color: var(--accent); }
.btn.accent:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--surface); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }

/* ---------- main ---------- */
main { max-width: 820px; margin: 20px auto 90px; padding: 0 16px; }
.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 10px; padding: 13px 16px;
  transition: border-color .15s;
}
.item:hover { border-color: var(--line-strong); }
.item.enter { animation: flashin .9s ease-out; }
@keyframes flashin {
  from { background: var(--accent-soft); border-color: var(--accent); }
  to { background: var(--surface); border-color: var(--line); }
}

.meta {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--muted); margin-bottom: 9px;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600;
  background: var(--chip); color: var(--fg);
}
.badge .sq { width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.badge.image .sq { background: var(--ok); }
.meta .m { display: inline-flex; align-items: center; gap: 5px; }
.meta .src { color: var(--fg); font-weight: 500; }

.preview {
  white-space: pre-wrap; word-break: break-all; font-size: 13.5px; line-height: 1.6;
  color: var(--fg); margin: 2px 0;
}
.preview.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.preview.hidden { display: none; }
pre.full {
  white-space: pre-wrap; word-break: break-all; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px;
  margin: 8px 0 2px; max-height: 320px; overflow: auto; font-size: 12.5px; line-height: 1.6;
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace; display: none;
}
pre.full.show { display: block; }

.thumb {
  max-width: 300px; max-height: 190px; object-fit: contain; cursor: zoom-in;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2);
  display: block;
}
.thumb:hover { border-color: var(--line-strong); }

.ops { display: flex; gap: 8px; margin-top: 11px; align-items: center; flex-wrap: wrap; }
.ops .spacer { flex: 1; }

.empty { text-align: center; color: var(--muted); padding: 76px 20px; }
.empty svg { color: var(--line-strong); margin-bottom: 14px; }
.empty h2 { font-size: 15px; margin: 0 0 6px; color: var(--fg); font-weight: 600; }
.empty p { margin: 0; font-size: 13px; }

#moreRow { text-align: center; margin: 16px 0 4px; }
#countHint { text-align: center; color: var(--faint); font-size: 12px; margin-top: 14px; }

/* jump-to-latest */
#jump {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
  padding: 9px 16px; font-size: 13px; cursor: pointer; box-shadow: var(--shadow-pop);
  display: none; align-items: center; gap: 7px; z-index: 70; font-family: inherit;
}
#jump.show { display: inline-flex; }
#jump:hover { background: var(--accent-hover); }

/* toasts */
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 90; }
.toast {
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 10px 14px;
  box-shadow: var(--shadow-pop); font-size: 13px; max-width: 320px;
}
.toast.err { border-left-color: var(--danger); }
.toast.ok { border-left-color: var(--ok); }
.toast.out { opacity: 0; transform: translateX(14px); transition: all .3s; }

/* lightbox */
#lightbox {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .72); z-index: 100;
  display: none; place-items: center; cursor: zoom-out;
}
#lightbox.show { display: grid; }
#lightbox img { max-width: 92vw; max-height: 90vh; border-radius: var(--radius); background: var(--surface); }
#lightbox .tip { position: absolute; top: 18px; right: 22px; color: #cbd5e1; font-size: 12.5px; }

@media (max-width: 620px) {
  .brand small { display: none; }
  .conn, .bar .sep { display: none; }
  main { margin-top: 14px; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="logo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <path d="M9 12h6M9 16h4"/>
        </svg>
      </div>
      <div>
        <h1>share-clip</h1>
        <small>局域网剪贴板共享 · 实时同步</small>
      </div>
    </div>

    <div class="conn" id="conn"><span class="dot"></span><span id="connText">连接中…</span></div>
    <span class="sep"></span>

    <div class="nodewrap">
      <button class="nodepill" id="nodePill" onclick="toggleRoster(event)" title="点击查看节点列表">
        <span class="dot"></span><b id="nodeCount">0</b><span>台节点在线</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="roster" id="roster"></div>
    </div>

    <button class="btn" onclick="fullRefresh()" title="立即重新加载历史">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      刷新
    </button>
    <button class="btn danger" onclick="clearAll()" title="清空全部历史记录">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      清空
    </button>
  </div>
</header>

<main>
  <div id="list"></div>
  <div id="moreRow"><button class="btn" id="moreBtn" onclick="loadMore()" hidden>加载更多</button></div>
  <div id="countHint"></div>
</main>

<button id="jump" onclick="jumpTop()">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
  <span id="jumpText"></span>
</button>

<div id="toasts"></div>

<div id="lightbox" onclick="this.classList.remove('show')">
  <span class="tip">点击任意处关闭 · Esc</span>
  <img id="lightboxImg" alt="剪贴板图片">
</div>

<script>
"use strict";
const PAGE = 50;
let offset = 0, busy = false, hasMore = true;
const ids = new Set();            // rendered item ids (dedup across SSE + pages)
let fullCache = {};               // id -> full text (lazily fetched)
let pendingNew = 0;

/* ---------------- helpers ---------------- */

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}

// 统一显示精确时间（不再使用相对时间）
function fmtTime(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function toast(msg, type) {
  const t = document.createElement("div");
  t.className = "toast " + (type || "");
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(() => {
    t.classList.add("out");
    setTimeout(() => t.remove(), 350);
  }, 3200);
}

async function copyText(str) {
  try {
    await navigator.clipboard.writeText(str);
  } catch (e) {
    // navigator.clipboard 需要安全上下文；http 访问时用兼容方案
    const ta = document.createElement("textarea");
    ta.value = str;
    ta.style.cssText = "position:fixed;opacity:0;";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    if (!ok) throw e;
  }
}

/* ---------------- rendering ---------------- */

function emptyState() {
  const d = document.createElement("div");
  d.className = "empty";
  d.innerHTML =
    '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="8" y="2" width="8" height="4" rx="1"/>' +
      '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>' +
      '<path d="M9 12h6M9 16h4"/></svg>' +
    "<h2>暂无历史记录</h2>" +
    "<p>在任意一台客户端上复制文本或图片，这里会实时自动出现。</p>";
  return d;
}

function renderList(items) {
  offset = 0;
  ids.clear();
  const list = $("list");
  list.innerHTML = "";
  if (!items.length) {
    list.appendChild(emptyState());
    hasMore = false;
  } else {
    items.forEach(it => addRendered(it, "append"));   // API 已按新→旧排序
    offset = items.length;
    hasMore = items.length >= PAGE;
  }
  $("moreBtn").hidden = !hasMore;
  updateCountHint();
}

function addRendered(it, where) {           // 'append' | 'prepend'
  if (ids.has(it.id)) return;
  const list = $("list");
  const empty = list.querySelector(".empty");
  if (empty) empty.remove();
  ids.add(it.id);
  const el = renderItem(it);
  if (where === "prepend") {
    el.classList.add("enter");
    list.insertBefore(el, list.firstChild);
  } else {
    list.appendChild(el);
  }
}

function prependItem(it) {                  // newest first
  addRendered(it, "prepend");
  if (window.scrollY > 260) {
    pendingNew++;
    $("jumpText").textContent = pendingNew + " 条新记录";
    $("jump").classList.add("show");
  }
}

function updateCountHint() {
  $("countHint").textContent = ids.size ? "已加载 " + ids.size + " 条" : "";
}

function jumpTop() {
  pendingNew = 0;
  $("jump").classList.remove("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const ICON = {
  monitor: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>',
  clock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  size: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M21 3 3 21M9 3H3v6M15 21h6v-6"/></svg>',
};

function renderItem(it) {
  const box = document.createElement("div");
  box.className = "item " + it.kind;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML =
    '<span class="badge ' + it.kind + '"><span class="sq"></span>' +
      (it.kind === "image" ? "图片" : "文本") + "</span>" +
    '<span class="m">' + ICON.monitor + '<span class="src">' + esc(it.sourceName || it.sourceId) + "</span></span>" +
    '<span class="m">' + ICON.clock + '<span class="num" title="' + esc(it.time) + '">' + fmtTime(it.time) + "</span></span>" +
    '<span class="m num">' + ICON.size + fmtSize(it.size) + "</span>";
  box.appendChild(meta);

  const ops = document.createElement("div");
  ops.className = "ops";

  if (it.kind === "image") {
    const img = document.createElement("img");
    img.className = "thumb";
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = "剪贴板图片 #" + it.id;
    img.src = "/api/items/" + it.id + "/content";
    img.onclick = () => {
      $("lightboxImg").src = img.src;
      $("lightbox").classList.add("show");
    };
    box.appendChild(img);
  } else {
    const short = document.createElement("div");
    short.className = "preview clamp";
    short.textContent = it.preview || "";
    box.appendChild(short);

    const full = document.createElement("pre");
    full.className = "full";
    box.appendChild(full);

    const expandBtn = document.createElement("button");
    expandBtn.className = "btn sm";
    expandBtn.innerHTML = "展开全文";
    expandBtn.onclick = async () => {
      if (full.classList.contains("show")) {
        full.classList.remove("show");
        short.classList.remove("hidden");
        short.classList.add("clamp");
        expandBtn.innerHTML = "展开全文";
        return;
      }
      if (!(it.id in fullCache)) {
        try {
          const r = await fetch("/api/items/" + it.id + "/content");
          if (!r.ok) throw new Error(r.status);
          fullCache[it.id] = await r.text();
        } catch (e) { toast("加载全文失败", "err"); return; }
      }
      full.textContent = fullCache[it.id];
      full.classList.add("show");
      short.classList.remove("clamp");
      short.classList.add("hidden");       // 展开后不再重复显示摘要
      expandBtn.innerHTML = "收起";
    };
    ops.appendChild(expandBtn);

    const copyBtn = document.createElement("button");
    copyBtn.className = "btn sm";
    copyBtn.innerHTML = "复制到浏览器";
    copyBtn.onclick = async () => {
      try {
        if (!(it.id in fullCache)) {
          const r = await fetch("/api/items/" + it.id + "/content");
          fullCache[it.id] = await r.text();
        }
        await copyText(fullCache[it.id]);
        toast("已复制到本机浏览器剪贴板", "ok");
      } catch (e) { toast("复制失败（浏览器可能要求 https 或 localhost）", "err"); }
    };
    ops.appendChild(copyBtn);
  }

  ops.appendChild(document.createElement("span")).className = "spacer";

  const push = document.createElement("button");
  push.className = "btn sm accent";
  push.innerHTML =
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>' +
    "推送到全部在线客户端";
  push.onclick = async () => {
    push.disabled = true;
    try {
      const r = await fetch("/api/items/" + it.id + "/push", { method: "POST" });
      const d = await r.json();
      if (r.ok) toast("已推送到 " + d.clients + " 个在线客户端", "ok");
      else toast("推送失败: " + (d.error || r.status), "err");
    } catch (e) { toast("推送失败: " + e, "err"); }
    push.disabled = false;
  };
  ops.appendChild(push);

  box.appendChild(ops);
  return box;
}

/* ---------------- data loading ---------------- */

async function fullRefresh() {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch("/api/history?limit=" + PAGE + "&offset=0");
    const data = await r.json();
    renderList(data.items || []);
  } catch (e) { toast("加载失败: " + e, "err"); }
  busy = false;
}

async function loadMore() {
  if (busy || !hasMore) return;
  busy = true;
  try {
    const r = await fetch("/api/history?limit=" + PAGE + "&offset=" + offset);
    const data = await r.json();
    const items = data.items || [];
    for (const it of items) addRendered(it, "append");   // 按 id 去重，SSE 抢跑过也无妨
    offset += items.length;
    hasMore = items.length >= PAGE;
    $("moreBtn").hidden = !hasMore;
    updateCountHint();
  } catch (e) { toast("加载失败: " + e, "err"); }
  busy = false;
}

// syncLatest catches up anything missed while the SSE stream was down.
async function syncLatest() {
  if (busy) return;
  try {
    const r = await fetch("/api/history?limit=" + PAGE + "&offset=0");
    if (!r.ok) return;
    const items = (await r.json()).items || [];
    const fresh = items.filter(it => !ids.has(it.id)).sort((a, b) => a.id - b.id);
    for (const it of fresh) prependItem(it);
  } catch (e) { /* silent */ }
}

async function clearAll() {
  if (!confirm("确定清空全部历史记录？此操作不可恢复。")) return;
  try {
    await fetch("/api/history/clear", { method: "POST" });
    toast("历史记录已清空", "ok");
    renderList([]);
  } catch (e) { toast("清空失败: " + e, "err"); }
}

/* ---------------- presence + realtime (SSE) ---------------- */

function toggleRoster(ev) {
  ev.stopPropagation();
  $("roster").classList.toggle("open");
}
document.addEventListener("click", e => {
  if (!e.target.closest(".nodewrap")) $("roster").classList.remove("open");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    $("roster").classList.remove("open");
    $("lightbox").classList.remove("show");
  }
});

function renderStatus(st) {
  const n = st.count || 0;
  const pill = $("nodePill");
  $("nodeCount").textContent = n;
  pill.classList.toggle("online", n > 0);
  document.title = (n ? "(" + n + " 台在线) " : "") + "share-clip · 局域网剪贴板";

  const rs = $("roster");
  rs.innerHTML = "<h3>在线节点</h3>";
  if (!st.clients || !st.clients.length) {
    rs.insertAdjacentHTML("beforeend", '<div class="none">暂无在线节点，启动 shareclip-client 后自动出现</div>');
    return;
  }
  for (const c of st.clients) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<span class="dot"></span><span></span><span class="id"></span>';
    row.children[1].textContent = c.name || c.id;
    row.children[2].textContent = c.id && c.id !== c.name ? c.id : "";
    rs.appendChild(row);
  }
}

function setConn(state) {   // open | retry | down
  const c = $("conn");
  c.classList.remove("retry", "down");
  if (state === "retry") { c.classList.add("retry"); $("connText").textContent = "重连中…"; }
  else if (state === "down") { c.classList.add("down"); $("connText").textContent = "已断开"; }
  else $("connText").textContent = "实时已连接";
}

let es = null, firstOpen = true;

function connect() {
  es = new EventSource("/api/events");
  es.onopen = () => {
    setConn("open");
    if (!firstOpen) syncLatest();        // reconnect: catch up missed clips
    firstOpen = false;
  };
  es.onerror = () => {
    if (!es) return;
    setConn(es.readyState === EventSource.CONNECTING ? "retry" : "down");
  };
  es.addEventListener("status", e => {
    try { renderStatus(JSON.parse(e.data)); } catch (_) {}
  });
  es.addEventListener("clip", e => {
    try {
      const it = JSON.parse(e.data);
      if (!ids.has(it.id)) prependItem(it);
      updateCountHint();
    } catch (_) {}
  });
  es.addEventListener("cleared", () => {
    renderList([]);
    fullCache = {};
    toast("历史已被其它会话清空", "");
  });
}

/* ---------------- boot ---------------- */

fullRefresh();
connect();
setInterval(syncLatest, 30000);          // low-frequency safety net
</script>
